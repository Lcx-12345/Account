<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HTML 示例</title>
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; margin: 32px; }
      .card { border: 1px solid #e5e7eb; border-radius: 12px; padding: 16px; max-width: 640px; }
      .k { color: #6b7280; }
      code { background: #f3f4f6; padding: 2px 6px; border-radius: 6px; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>HTML 示例页面</h1>
      <p class="k">用于验证可直接生成的文本格式。</p>
      <p>包含一个内联样式与一段 <code>code</code>。</p>
    </div>
  </body>
</html>
