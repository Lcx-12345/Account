<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="circleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="600" height="400" fill="url(#bgGradient)"/>

  <circle cx="150" cy="180" r="60" fill="url(#circleGradient)" filter="url(#shadow)"/>
  <rect x="270" y="120" width="120" height="120" rx="20" fill="#4facfe" filter="url(#shadow)"/>
  <polygon points="500,120 560,240 440,240" fill="#43e97b" filter="url(#shadow)"/>

  <line x1="100" y1="300" x2="500" y2="300" stroke="white" stroke-width="2" stroke-dasharray="10,5" opacity="0.6"/>

  <circle cx="150" cy="180" r="80" fill="none" stroke="white" stroke-width="2" opacity="0.3"/>
  <rect x="250" y="100" width="160" height="160" rx="30" fill="none" stroke="white" stroke-width="2" opacity="0.3"/>

  <text x="300" y="350" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="24" font-weight="bold">
    SVG 矢量图表示例
  </text>
  <text x="300" y="375" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" opacity="0.8">
    Scalable Vector Graphics
  </text>

  <circle cx="150" cy="180" r="30" fill="white" opacity="0.9">
    <animate attributeName="r" values="30;40;30" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
